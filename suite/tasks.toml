# Task registry: the single source for what the suite runs and reports.
#
# [dashboard.*] reproduces the former BENCHMARKS dict of scripts/make_dashboard.py
# verbatim (families with cat_prefix, VLMEvalKit dataset names, headline metrics,
# lm-eval metric names). [tasks.*] declares launchable tasks and their policy:
# owning harness, judge requirement, local assets, context length, and whether
# the task is in the HF model-card set (card) or the report table (report).

version = 1

[defaults]
max_model_len = 131072
# Instruct checkpoints are prompted through their chat template on the text lane.
lm_eval_chat_template = true

