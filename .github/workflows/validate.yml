name: Text integration validation
on:
  pull_request:
  push:
    branches: [main, nemo-evaluator]
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -v
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.sh|*.slurm|*.sbatch) bash -n "$file" ;;
            esac
          done < <(git ls-files -z -- launchers slurm scripts dockerfiles)
