name: Audio dashboard validation
on:
  pull_request:
  push:
    branches: [main, audio-results]
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - name: Published dashboard behavior
        run: node tests/dashboard_audio_behavior.cjs docs/index.html
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh' '*.slurm' '*.sbatch')
