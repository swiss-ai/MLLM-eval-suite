task: math_lvl5_verify
tag:
  - math_word_problems
dataset_path: DigitalLearningGmbH/MATH-lighteval
dataset_name: default
output_type: generate_until
test_split: test
process_docs: !function utils.process_docs_math_lvl5
doc_to_text: "Problem: {{problem}}\nAnswer:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Problem:"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 16384
num_fewshot: 0
metadata:
  version: 1.0
