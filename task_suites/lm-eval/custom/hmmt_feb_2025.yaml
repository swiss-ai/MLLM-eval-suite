    - "Problem:"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
    - "<|assistant_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 16384
num_fewshot: 0
metadata:
  version: 1.0
