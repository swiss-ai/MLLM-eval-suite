task: hmmt_feb_2025
tag:
  - math_word_problems
dataset_path: MathArena/hmmt_feb_2025
output_type: generate_until
test_split: train
doc_to_text: "Problem: {{problem}}\nAnswer:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
